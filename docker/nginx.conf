# Forwarded headers are accepted only from the dedicated Tunnel container.
map $http_x_forwarded_proto $origin_https {
    default "";
    https on;
}
geo $realip_remote_addr $trusted_proxy {
    default 0;
    172.30.77.2/32 1;
}
map "$trusted_proxy:$origin_https" $trusted_https {
    default "";
    "1:on" on;
}
server {
    listen 80;
    server_name _;
    root /var/www/unyohub;
    index index.php;
    client_max_body_size 12m;
    # Only cloudflared may supply the original client address.
    set_real_ip_from 172.30.77.2/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ ^/(commands|libs_data|common_dbs|config|data|docker)(/|$) { deny all; }
    location ~ /\. { deny all; }
    location ~ ^/railroad_ { rewrite ^/(.*)$ /index.php/$1 last; }
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $trusted_https;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_pass app:9000;
    }
    location / { try_files $uri $uri/ =404; }
}
